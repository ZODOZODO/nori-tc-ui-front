# 정본 — 이 파일이 실제 배포 이미지에 들어간다.
#   .gitlab-ci.yml 의 kaniko 가 --context $CI_PROJECT_DIR(= 이 레포) 로 빌드하고
#   deploy/docker/Dockerfile-ci:15 가 이 경로를 COPY 한다.
# nori-tc-exec/deploy/docker/nginx.conf 에 같은 내용의 사본이 있으나 배포되지 않는다
# (exec CI 에는 ui-front 이미지 빌드 job 이 없다). 내용 변경은 반드시 이 파일에 먼저 가한다.
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 8080;
        server_name _;

        root /app/build;
        index index.html;

        # 보안 응답 헤더. CSP 의 각 지시자는 빌드 산출물 실측으로 정했다:
        # - style-src 'unsafe-inline' : React 인라인 style 속성 37곳(CSP 는 style attr 도 style-src 로 지배)
        # - style-src/font-src 의 fonts.* : index.html 이 Google Fonts 를 외부에서 로드한다
        # - img-src blob: : three.js 가 blob URL 텍스처 경로를 지원한다(현재 미사용이나 차단 시 조용히 깨진다)
        # 인라인 script 는 0건이라 script-src 에 'unsafe-inline' 을 주지 않는다.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        location /api/ {
            # FQDN 을 쓴다. Dockerfile-ci 의 `RUN nginx -t` 가 빌드 시점에 upstream 호스트를 해석하는데,
            # kaniko 빌드 pod 은 ns gitlab 에서 뜨므로 짧은 이름 `tc-ui-backend` 는 gitlab 네임스페이스로
            # 해석돼 빌드가 깨진다(2026-08-28 실측: host not found in upstream). FQDN 은 크로스 네임스페이스로
            # 해석되므로 통과한다. 대신 네임스페이스를 옮길 때 이 줄을 함께 고쳐야 한다.
            proxy_pass http://tc-ui-backend.tc.svc.cluster.local:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # 클라이언트가 보낸 X-Forwarded-For 를 이어붙이지 않고 덮어쓴다.
            # $proxy_add_x_forwarded_for 는 클라이언트 제어 값을 그대로 전달해
            # 업스트림의 IP 기반 판정(actuator 화이트리스트)을 스푸핑에 노출시킨다.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
