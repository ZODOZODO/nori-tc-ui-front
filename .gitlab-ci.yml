stages:
  - check
  - package
  - build
  - scan
  - deploy

variables:
  HARBOR_REGISTRY: harbor.nori.local
  HARBOR_PROJECT: nori-tc
  IMAGE_NAME: $HARBOR_REGISTRY/$HARBOR_PROJECT/tc-ui-front
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  NAMESPACE: tc

# 애플리케이션 이미지와 배포 결과에 영향을 주는 파일을 한곳에서 관리한다.
.frontend-change-rules:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: &frontend-changes
        - src/**/*
        - public/**/*
        - index.html
        - package.json
        - package-lock.json
        - vite.config.ts
        - tsconfig.json
        - tsconfig.app.json
        - tsconfig.node.json
        - deploy/**/*

pipeline-ok:
  stage: check
  # 비코드(docs 등) 푸시의 placeholder. GitLab.com 공유러너(월 400분 그룹 쿼터)를 쓰지 않도록
  # 자체호스팅 nori-msa 러너에서 실행한다(ci_quota_exceeded 회피). package 잡과 동일 러너/이미지.
  tags:
    - nori-msa
  image: node:22-alpine
  script:
    - echo "no relevant changes"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: *frontend-changes
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'

# ------------------------------------------------------------------------------
# W2-7 — Helm 차트 검증 (helm lint + helm template 오프라인 렌더, 2026.07.13~07.17)
# ------------------------------------------------------------------------------
# ui-front 자체 Helm 차트가 lint + 렌더되는지 클러스터 없이 검증한다.
# kubectl:1.32.2 이미지에 helm 이 포함된다. 본 주는 "검증 잡 정의"까지 —
# deploy 단계 차단 needs 배선(scan/helm-validate 실패 시 deploy 차단)은 W3 에서 한다.
helm-validate:
  stage: check
  tags:
    - nori-msa
  image: harbor.nori.local/library/kubectl:1.32.2
  script:
    - echo "== helm lint =="
    - helm lint ./deploy/helm/tc-ui-front -f ./deploy/helm/tc-ui-front/values.yaml
    - echo "== helm template (dry render) =="
    - helm template tc-ui-front ./deploy/helm/tc-ui-front -f ./deploy/helm/tc-ui-front/values.yaml > /dev/null
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - deploy/helm/**/*

# ------------------------------------------------------------------------------
# W3-1 — 단위 테스트 게이트 (2026.07.13~07.17)
# ------------------------------------------------------------------------------
# package(빌드) 전에 프론트 단위 테스트(node --test)를 돌려 회귀를 차단한다.
# e2e(Playwright)는 브라우저가 필요해 self-hosted 러너에서 미실행(로컬/검증 트랙 유지) — 본 잡은 test:unit 만.
test:
  extends: .frontend-change-rules
  stage: check
  tags:
    - nori-msa
  image: node:22-alpine
  script:
    - npm install
    - npm run test:unit

package:
  extends: .frontend-change-rules
  stage: package
  # W3-2 게이트: test 실패 시 package 차단 → build/scan/deploy 까지 연쇄 차단.
  needs: ["test"]
  tags:
    - nori-msa
  image: node:22-alpine
  script:
    - npm install
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1h

build:
  extends: .frontend-change-rules
  stage: build
  needs: ["package"]
  tags:
    - nori-msa
  image:
    name: harbor.nori.local/library/kaniko:debug
    entrypoint: [""]
  # Harbor push 인증: 러너(k8s-tc-runner)가 harbor-creds-secret 을 /kaniko/.docker 로 마운트한다.
  # kaniko 가 기본 위치(/kaniko/.docker/config.json)에서 읽으므로 여기서 자격증명을 다루지 않는다.
  script:
    - /kaniko/executor
      --context $CI_PROJECT_DIR
      --dockerfile $CI_PROJECT_DIR/deploy/docker/Dockerfile-ci
      --destination $IMAGE_NAME:$IMAGE_TAG
      --destination $IMAGE_NAME:latest

# ------------------------------------------------------------------------------
# W1-4b — Trivy 이미지 취약점 스캔 (명령·임계 정의, 2026.07.13~07.17)
# ------------------------------------------------------------------------------
# build 가 Harbor 로 push 한 tc-ui-front 이미지를 스캔한다. 임계: HIGH,CRITICAL → exit-code 1(차단),
# OWASP High(CVSS>=7.0) 차단 임계와 정합. W3-2 자동 게이트: when:manual + allow_failure:true 제거 →
# 자동 실행 + 차단(allow_failure 기본 false). deploy 는 needs:["scan-image"] 로 scan 통과를 강제한다.
scan-image:
  extends: .frontend-change-rules
  stage: scan
  needs: ["build"]
  tags:
    - nori-msa
  image:
    name: harbor.nori.local/library/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_SEVERITY: "HIGH,CRITICAL"
    TRIVY_EXIT_CODE: "1"
    # 자체서명 Harbor(nori.local 사설 CA) 신뢰. SSL_CERT_FILE(시스템 풀 대체)이 아니라
    # SSL_CERT_DIR(추가)라 trivy 의 공개 vuln DB(mirror.gcr.io) 다운로드 TLS 도 그대로 유지된다.
    SSL_CERT_DIR: "/etc/ssl/certs:/tmp/extra-certs"
    # 스캔 대상 이미지 pull 인증: 러너가 /kaniko/.docker 에 마운트한 harbor-creds-secret(config.json) 재사용.
    DOCKER_CONFIG: "/kaniko/.docker"
  before_script:
    # HARBOR_CA_CERT = File 타입 CI 변수(nori.local CA PEM). Go 가 스캔하는 디렉터리에 배치.
    - mkdir -p /tmp/extra-certs
    - cp "$HARBOR_CA_CERT" /tmp/extra-certs/nori-local-ca.crt
  script:
    - trivy image --severity "$TRIVY_SEVERITY" --exit-code "$TRIVY_EXIT_CODE" --ignore-unfixed --no-progress "$IMAGE_NAME:$IMAGE_TAG"

# W3-2 게이트: deploy 는 scan-image 통과 후에만 가능(needs) + prod 배포는 수동 승인(when:manual).
deploy:
  stage: deploy
  needs: ["scan-image"]
  tags:
    - nori-msa
  image: harbor.nori.local/library/kubectl:1.32.2
  script:
    - helm upgrade --install tc-ui-front ./deploy/helm/tc-ui-front
      --namespace $NAMESPACE
      --set app.imageTag=$IMAGE_TAG
      -f ./deploy/helm/tc-ui-front/values.yaml
      --wait
      --timeout 300s
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: *frontend-changes
      when: manual
